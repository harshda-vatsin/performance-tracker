services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mmf
      POSTGRES_PASSWORD: mmf_dev_only
      POSTGRES_DB: mmf
    ports:
      - "5442:5432"
    volumes:
      - mmf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmf -d mmf"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mmf_pgdata:
